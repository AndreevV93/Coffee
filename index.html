<style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
const APP_VERSION = "2026.10.16";
const COLORS = [["umber","#6b4f3a","умбра"],["olive","#8a6239","олива"],["slate","#5c4030","грифель"],["clay","#7a4e3d","глина"],["pine","#6b5344","хвоя"],["cocoa","#3d281c","какао"],["rust","#8a3f32","ржавчина"],["stone","#a3845c","камень"]];

let sync = loadSync();

let toastTimer = 0, syncTimer = 0, pulling = false;

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function esc(s) {

function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return todayISO(d); }

function money(k) { return new Intl.NumberFormat("ru-RU", { style: "currency", currency: "RUB" }).format((k || 0) / 100); }

function colorOf(id) { return (COLORS.find((c) => c[0] === id) || COLORS[0])[1]; }
function personById(id) { return state.people.find((p) => p.id === id); }
function nameOf(id) { return personById(id)?.name || "Кто-то"; }

function emptyState() { return { people: [], cups: [], restocks: [], openings: [], updatedAt: "1970-01-01T00:00:00.000Z" }; }

    packs: (r.packs || []).map((p) => ({ id: p.id || uid(), name: p.name || "Кофе", priceKopecks: Number(p.priceKopecks) || 0, massGrams: Number(p.massGrams) || 250 })),

    coverageStart: r.coverageStart || "", splitMode: r.splitMode === "matched" ? "matched" : "pooled", note: r.note || "",

    people: (Array.isArray(s.people) ? s.people : []).map((p) => ({ id: p.id || uid(), name: p.name || "Без имени", color: COLORS.some((c) => c[0] === p.color) ? p.color : "cocoa", archived: Boolean(p.archived) })),
    cups: (Array.isArray(s.cups) ? s.cups : []).filter((c) => c && c.cups > 0).map((c) => ({ date: c.date, personId: c.personId, cups: Math.max(0, Math.round(Number(c.cups) * 2) / 2) })),

}
function loadState() {
  try {
    const own = localStorage.getItem("kofe-kassa-html-v1");
    if (own) return normalize(JSON.parse(own));
    const old = localStorage.getItem("coffee-kassa-v2");
    if (old) { const parsed = JSON.parse(old); return normalize(parsed.state || parsed); }
  } catch (e) {}

}
function loadSync() {
  try {
    const raw = JSON.parse(localStorage.getItem("kofe-kassa-sync") || "{}");
    return { masterKey: raw.masterKey || "", binId: raw.binId || "", password: raw.password || "", autoSync: raw.autoSync !== false, last: raw.last || "" };
  } catch (e) { return { masterKey: "", binId: "", password: "", autoSync: true, last: "" }; }
}
function loadTab() { const t = sessionStorage.getItem("kofe-kassa-tab"); return TABS.some((x) => x[0] === t) ? t : "balance"; }
function saveLocal() { localStorage.setItem("kofe-kassa-html-v1", JSON.stringify(state)); }
function saveSync() { localStorage.setItem("kofe-kassa-sync", JSON.stringify(sync)); }
function touch() { state.updatedAt = new Date().toISOString(); saveLocal(); if (!pulling) scheduleSync(); }
function toast(text) { const el = document.getElementById("toast"); el.textContent = text; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }

function sortRestocks(list) { return [...list].sort((a, b) => a.date === b.date ? a.id.localeCompare(b.id) : a.date < b.date ? -1 : 1); }
function sortOpenings(list) { return [...list].sort((a, b) => a.date === b.date ? a.id.localeCompare(b.id) : a.date < b.date ? -1 : 1); }
function totalKopecks(r) { return r.packs.reduce((s, p) => s + (p.priceKopecks || 0), 0); }
function cupsInRange(cups, start, end) { const map = new Map(); for (const e of cups) { if (e.cups <= 0 || e.date < start || e.date >= end) continue; map.set(e.personId, (map.get(e.personId) || 0) + e.cups); } return map; }
function earliestCup(cups) { let min = null; for (const e of cups) if (e.cups > 0 && (!min || e.date < min)) min = e.date; return min; }
function findPack(packId) { for (const r of state.restocks) { const p = r.packs.find((x) => x.id === packId); if (p) return { pack: p, restock: r }; } return null; }
function unopened() { const opened = new Set(state.openings.map((o) => o.packId)); const rows = []; for (const r of sortRestocks(state.restocks)) for (const p of r.packs) if (!opened.has(p.id)) rows.push({ pack: p, restock: r }); return rows; }
function lastPackDefaults(name) {
  const packs = sortRestocks(state.restocks).flatMap((r) => r.packs);
  if (name && name.trim()) { const needle = name.trim().toLowerCase(); for (let i = packs.length - 1; i >= 0; i--) if (packs[i].name.trim().toLowerCase() === needle) return { name: packs[i].name, priceKopecks: packs[i].priceKopecks, massGrams: packs[i].massGrams || 250 }; }

}
function uniqDates(dates) { return [...new Set(dates)].sort(); }
function computeCoverage(restock) {
  const end = restock.date;
  if (restock.coverageStart) { const start = restock.coverageStart < end ? restock.coverageStart : end; return { start, end, periods: start < end ? [{ start, end }] : [] }; }
  const events = [];
  if (state.openings.length) { for (const o of sortOpenings(state.openings)) if (o.date < restock.date) events.push(o.date); }
  else {
    const before = sortRestocks(state.restocks).filter((r) => r.id !== restock.id && (r.date < restock.date || (r.date === restock.date && r.id < restock.id)));

    for (const r of before) events.push(r.date);
  }
  events.push(restock.date);
  const uniq = uniqDates(events); const all = [];
  for (let i = 0; i < uniq.length - 1; i++) if (uniq[i] < uniq[i + 1]) all.push({ start: uniq[i], end: uniq[i + 1] });

}
function splitByWeights(total, weights) {
  const result = {};
  if (!weights.length || !total) { weights.forEach((w) => { result[w.id] = 0; }); return result; }

  const pool = positive.length ? positive : weights;
  const sumW = pool.reduce((s, w) => s + w.weight, 0);
  if (sumW <= 0) {
    const n = pool.length, base = Math.floor(total / n); let rem = total - base * n;

    for (let i = 0; i < n; i++) { const extra = rem > 0 ? 1 : 0; if (rem > 0) rem--; result[pool[i].id] = base + extra; }
    return result;
  }
  const rows = pool.map((w) => { const exact = (total * w.weight) / sumW; const v = Math.floor(exact); return { id: w.id, v, frac: exact - v }; });

  rows.sort((a, b) => b.frac - a.frac || a.id.localeCompare(b.id));
  for (let i = 0; i < remain; i++) rows[i % rows.length].v += 1;
  weights.forEach((w) => { result[w.id] = 0; });
  rows.forEach((r) => { result[r.id] = r.v; });

}
function peopleForSplit(map) {
  const ids = new Set(map.keys());
  const listed = state.people.filter((p) => !p.archived || ids.has(p.id) || (map.get(p.id) || 0) > 0);
  return listed.length ? listed : state.people.filter((p) => !p.archived);
}
function allocate(total, map) {
  const roster = peopleForSplit(map);
  const totalCups = [...map.values()].reduce((s, n) => s + n, 0);
  const empty = totalCups <= 0;
  const split = splitByWeights(total, roster.map((p) => ({ id: p.id, weight: empty ? 1 : (map.get(p.id) || 0) })));

}
function settle(restock) {

  const canMatch = restock.splitMode === "matched" && restock.packs.length > 0 && coverage.periods.length === restock.packs.length;
  if (canMatch) {
    const acc = new Map();
    restock.packs.forEach((pack, i) => {
      for (const s of allocate(pack.priceKopecks, cupsInRange(state.cups, coverage.periods[i].start, coverage.periods[i].end))) {
        const prev = acc.get(s.personId) || { personId: s.personId, cups: 0, shareKopecks: 0 };
        prev.cups += s.cups; prev.shareKopecks += s.shareKopecks; acc.set(s.personId, prev);

function settlements() { return sortRestocks(state.restocks).map(settle); }
function balances() {
  const net = new Map(state.people.map((p) => [p.id, 0]));

    net.set(s.restock.buyerId, (net.get(s.restock.buyerId) || 0) + s.total);

function historyPeriods() {
  const endExclusive = addDays(todayISO(), 1);

    const next = sorted[i + 1]; const found = findPack(o.packId);
    return { id: o.id, start: o.date, end: next ? next.date : endExclusive, label: found?.pack.name || "Пачка", current: !next };

function openPeriod() {

function nextColor() { const used = new Set(state.people.filter((p) => !p.archived).map((p) => p.color)); return COLORS.find((c) => !used.has(c[0]))?.[0] || COLORS[state.people.length % COLORS.length][0]; }

}
function ledgerDoc() { return { kofe: 1, appVersion: APP_VERSION, updatedAt: state.updatedAt, people: state.people, cups: state.cups, restocks: state.restocks, openings: state.openings }; }
function applyDoc(doc) { pulling = true; state = normalize(doc); saveLocal(); pulling = false; render(); }

function bytesToB64(bytes) { let s = ""; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); }

      <label class="lbl">Сколько последних периодов закрывает закупка</label><input class="field" name="periods" type="number" min="1" value="${d.periodsCovered || d.packs.length}" />
      <label class="row" style="margin-top:8px;font-size:14px"><input name="matched" type="checkbox" ${d.splitMode === "matched" ? "checked" : ""}/> Каждая пачка на свой период</label>
      <label class="lbl">Заметка</label><textarea class="field" name="note">${esc(d.note || "")}</textarea>
      <div class="card"><div class="muted">Делится ${money(live.total)} за ${formatDayShort(live.coverage.start)} — ${formatDayShort(live.coverage.end)}</div>${live.shares.map((s) => `<div class="split"><span>${esc(nameOf(s.personId))} · ${cupsWord(s.cups)}</span><b>${money(s.shareKopecks)}</b></div>`).join("") || `<div class="muted">Нет чашек в периоде — сумма делится поровну.</div>`}</div>
      <button class="btn" type="submit">Сохранить</button></form></div></div>`;
}
function openingSheet() {
  const d = ui.openingDraft; const rows = unopened();
  if (d.packId && !rows.some((r) => r.pack.id === d.packId)) { const cur = findPack(d.packId); if (cur) rows.unshift(cur); }
  return `<div class="sheet"><div class="panel"><div class="row"><h2 class="grow">Открыть пачку</h2><button class="btn-ghost sm" type="button" data-act="close">Закрыть</button></div>
    ${rows.length ? `<form id="opening-form"><label class="lbl">Дата</label><input class="field" type="date" name="date" value="${esc(d.date)}" /><label class="lbl">Пачка из закупок</label><select class="field" name="packId">${rows.map((r) => `<option value="${r.pack.id}" ${r.pack.id === d.packId ? "selected" : ""}>${esc(r.pack.name)} · ${money(r.pack.priceKopecks)} · ${formatMass(r.pack.massGrams)}</option>`).join("")}</select><p class="help">Отчётный период считается от даты открытия до следующего открытия. Цена берётся из закупки.</p><button class="btn" type="submit">Сохранить</button></form>` : `<div class="card muted">Все купленные пачки уже открыты. Сначала добавьте закупку.</div>`}</div></div>`;
}

function saveAppFile() {
  return (async () => {
    let text = "";
    try { text = await (await fetch(location.href, { cache: "no-store" })).text(); } catch (e) {}
    if (!text.includes("Кофе-касса")) text = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const file = new File([text], "index.html", { type: "text/html" });
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
      await navigator.share({ files: [file], title: "Кофе-касса" });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/html" }));
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Если файла нет в Загрузках, выберите «Сохранить в файлы»");
  })();
}
app.addEventListener("click", (e) => {
  capture();
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { ui.tab = tabBtn.dataset.tab; sessionStorage.setItem("kofe-kassa-tab", ui.tab); render(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "cup") { setCups(el.dataset.date, el.dataset.id, cupsOn(el.dataset.date, el.dataset.id) + Number(el.dataset.d)); return; }
  if (act === "month") { const [y, m] = ui.month.split("-").map(Number); ui.month = todayISO(new Date(y, m - 1 + Number(el.dataset.d), 1)).slice(0, 7); render(); return; }
  if (act === "today") { ui.selected = todayISO(); ui.month = ui.selected.slice(0, 7); render(); return; }
  if (act === "day") { ui.selected = el.dataset.date; ui.month = ui.selected.slice(0, 7); render(); return; }
  if (act === "add-restock") { openRestock(null); return; }
  if (act === "edit-restock") { openRestock(state.restocks.find((r) => r.id === el.dataset.id)); return; }
  if (act === "close") { ui.sheet = null; ui.restockDraft = null; ui.openingDraft = null; render(); return; }
  if (act === "add-pack") { ui.restockDraft.packs.push(blankPack()); ui.restockDraft.periodsCovered = ui.restockDraft.packs.length; render(); return; }
  if (act === "del-pack") { ui.restockDraft.packs.splice(Number(el.dataset.i), 1); if (!ui.restockDraft.packs.length) ui.restockDraft.packs.push(blankPack()); ui.restockDraft.periodsCovered = ui.restockDraft.packs.length; render(); return; }
  if (act === "del-restock") {
    if (!confirm("Удалить закупку и открытия её пачек?")) return;
    const removed = state.restocks.find((r) => r.id === el.dataset.id);
    const ids = new Set((removed?.packs || []).map((p) => p.id));
    state.restocks = state.restocks.filter((r) => r.id !== el.dataset.id);
    state.openings = state.openings.filter((o) => !ids.has(o.packId));
    touch(); render(); return;
  }
  if (act === "open-pack") { const left = unopened(); ui.openingDraft = { date: ui.selected, packId: left[0]?.pack.id || "" }; ui.sheet = "opening"; render(); return; }
  if (act === "del-open") { state.openings = state.openings.filter((o) => o.id !== el.dataset.id); touch(); render(); return; }
  if (act === "color") { const p = personById(el.dataset.id); if (p) p.color = el.dataset.color; touch(); render(); return; }
  if (act === "del-person") {
    if (!confirm("Удалить участника, его чашки и закупки, где он платил?")) return;
    const id = el.dataset.id;
    const removed = state.restocks.filter((r) => r.buyerId === id);
    const packIds = new Set(removed.flatMap((r) => r.packs.map((p) => p.id)));
    state.people = state.people.filter((p) => p.id !== id);
    state.cups = state.cups.filter((c) => c.personId !== id);
    state.restocks = state.restocks.filter((r) => r.buyerId !== id);
    state.openings = state.openings.filter((o) => !packIds.has(o.packId));
    touch(); render(); return;
  }
  if (act === "bin-create") { createBin().catch((err) => toast(err.message)); return; }
  if (act === "bin-push") { pushRemote().catch((err) => toast(err.message)); return; }
  if (act === "bin-pull") { pullRemote().catch((err) => toast(err.message)); return; }
  if (act === "save-html") { saveAppFile().catch((err) => toast(err.message || "Не удалось сохранить файл")); return; }
  if (act === "export") {
    const blob = new Blob([JSON.stringify(ledgerDoc(), null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "kofe-kassa.json"; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if (act === "import") { document.getElementById("import-file").click(); return; }
  if (act === "wipe") { if (!confirm("Очистить данные на этом устройстве? JSONBin не удалится.")) return; state = emptyState(); state.updatedAt = new Date().toISOString(); saveLocal(); render(); return; }
  if (act === "hist-apply") render();
});
app.addEventListener("submit", (e) => {
  capture();
  if (e.target.id === "add-person") { e.preventDefault(); const name = new FormData(e.target).get("name").toString().trim(); if (!name) return; state.people.push({ id: uid(), name, color: nextColor(), archived: false }); touch(); render(); return; }
  if (e.target.id === "restock-form") { e.preventDefault(); saveRestock(); return; }
  if (e.target.id === "opening-form") {
    e.preventDefault(); const date = e.target.date.value; const packId = e.target.packId.value;
    if (!packId) { toast("Нет пачки"); return; }
    state.openings = state.openings.filter((o) => o.packId !== packId);
    state.openings.push({ id: uid(), date, packId });
    ui.sheet = null; touch(); toast("Пачка открыта"); render();
  }
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.person) { const p = personById(t.dataset.person); if (p) p.name = t.value.trim() || p.name; touch(); return; }
  if (t.dataset && t.dataset.act === "archive") { const p = personById(t.dataset.id); if (p) p.archived = t.checked; touch(); render(); return; }
  if (t.id === "period") { ui.periodId = t.value; render(); return; }
  if (t.id === "who") { ui.personId = t.value; render(); return; }
  if (t.id === "estimate") { ui.estimate = t.value; render(); return; }
  if (t.id === "import-file" && t.files && t.files[0]) {
    t.files[0].text().then((text) => { applyDoc(JSON.parse(text)); touch(); toast("JSON загружен"); }).catch(() => toast("Не удалось прочитать файл"));
  }
  if (t.id === "masterKey" || t.id === "binId" || t.id === "binPassword" || t.id === "autoSync") capture();
  if (t.dataset && t.dataset.kind === "name" && ui.restockDraft) {
    const found = lastPackDefaults(t.value);
    if (found && t.value.trim() && found.name.trim().toLowerCase() === t.value.trim().toLowerCase()) {
      const i = Number(t.dataset.pack); const form = document.getElementById("restock-form");
      form["pprice" + i].value = rub(found.priceKopecks); form["pmass" + i].value = found.massGrams;
      ui.restockDraft.packs[i].priceKopecks = found.priceKopecks; ui.restockDraft.packs[i].massGrams = found.massGrams;
    }
  }
});
render();
bootSync();
</script>
</body>
