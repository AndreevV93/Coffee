<!DOCTYPE html>
<html lang="ru">

<title>Кофе-касса</title>

<style>

function saveAppFile() {
  return (async () => {
    let text = "";
    try { text = await (await fetch(location.href, { cache: "no-store" })).text(); } catch (e) {}
    if (!text.includes("Кофе-касса")) text = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const file = new File([text], "index.html", { type: "text/html" });
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
      await navigator.share({ files: [file], title: "Кофе-касса" });
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/html" }));
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Если файла нет в Загрузках, выберите «Сохранить в файлы»");
  })();
}
app.addEventListener("click", (e) => {
  capture();
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { ui.tab = tabBtn.dataset.tab; ui.pdfMenu = false; ui.checkMenu = ""; sessionStorage.setItem("kofe-kassa-tab", ui.tab); render(true); return; }
  if (ui.pdfMenu && !e.target.closest("#pdf-menu") && !e.target.closest("[data-scope='one']")) {
    ui.pdfMenu = false;
    if (!e.target.closest("[data-act]")) { render(); return; }
  }
  if (ui.checkMenu && !e.target.closest("#check-menu") && !e.target.closest("[data-act='check-menu']")) {
    ui.checkMenu = "";
    if (!e.target.closest("[data-act]")) { render(); return; }
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "cup") {
    const field = el.parentElement && el.parentElement.querySelector(".cup-input");
    const base = field ? parseCups(field.value) : cupsOn(el.dataset.date, el.dataset.id);
    setCups(el.dataset.date, el.dataset.id, base + Number(el.dataset.d));
    return;
  }
  if (act === "month") { const [y, m] = ui.month.split("-").map(Number); ui.month = todayISO(new Date(y, m - 1 + Number(el.dataset.d), 1)).slice(0, 7); render(); return; }
  if (act === "today") { ui.selected = todayISO(); ui.month = ui.selected.slice(0, 7); render(); return; }
  if (act === "day") { ui.selected = el.dataset.date; ui.month = ui.selected.slice(0, 7); render(); return; }
  if (act === "add-restock") { openRestock(null); return; }
  if (act === "edit-restock") { openRestock(state.restocks.find((r) => r.id === el.dataset.id)); return; }
  if (act === "close") { ui.sheet = null; ui.restockDraft = null; ui.openingDraft = null; render(); return; }
  if (act === "add-pack") { ui.restockDraft.packs.push(blankPack()); ui.restockDraft.periodsCovered = ui.restockDraft.packs.length; render(); return; }
  if (act === "del-pack") { ui.restockDraft.packs.splice(Number(el.dataset.i), 1); if (!ui.restockDraft.packs.length) ui.restockDraft.packs.push(blankPack()); ui.restockDraft.periodsCovered = ui.restockDraft.packs.length; render(); return; }
  if (act === "del-restock") {
    if (!confirm("Удалить закупку и открытия её пачек?")) return;
    const removed = state.restocks.find((r) => r.id === el.dataset.id);
    const ids = new Set((removed?.packs || []).map((p) => p.id));
    state.restocks = state.restocks.filter((r) => r.id !== el.dataset.id);
    state.openings = state.openings.filter((o) => !ids.has(o.packId));
    touch(); render(); return;
  }
  if (act === "open-pack") { const left = unopened(); ui.openingDraft = { date: ui.selected, packId: left[0]?.pack.id || "" }; ui.sheet = "opening"; render(); return; }
  if (act === "del-open") { state.openings = state.openings.filter((o) => o.id !== el.dataset.id); touch(); render(); return; }
  if (act === "color") { const p = personById(el.dataset.id); if (p) p.color = el.dataset.color; touch(); render(); return; }
  if (act === "del-person") {
    if (!confirm("Удалить участника, его чашки и закупки, где он платил?")) return;
    const id = el.dataset.id;
    const removed = state.restocks.filter((r) => r.buyerId === id);
    const packIds = new Set(removed.flatMap((r) => r.packs.map((p) => p.id)));
    state.people = state.people.filter((p) => p.id !== id);
    state.cups = state.cups.filter((c) => c.personId !== id);
    state.restocks = state.restocks.filter((r) => r.buyerId !== id);
    state.openings = state.openings.filter((o) => !packIds.has(o.packId));
    touch(); render(); return;
  }
  if (act === "bin-create") { createBin().catch((err) => toast(err.message)); return; }
  if (act === "bin-push") { pushRemote().catch((err) => toast(err.message)); return; }
  if (act === "bin-pull") { pullRemote().catch((err) => toast(err.message)); return; }
  if (act === "save-html") { saveAppFile().catch((err) => toast(err.message || "Не удалось сохранить файл")); return; }
  if (act === "export") {
    const blob = new Blob([JSON.stringify(ledgerDoc(), null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "kofe-kassa.json"; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if (act === "import") { document.getElementById("import-file").click(); return; }
  if (act === "wipe") { if (!confirm("Очистить данные на этом устройстве? JSONBin не удалится.")) return; state = emptyState(); state.updatedAt = new Date().toISOString(); saveLocal(); render(); return; }
  if (act === "hist-apply") render();
  if (act === "hist-mode") { ui.histMode = el.dataset.mode === "full" ? "full" : "short"; render(); return; }
  if (act === "pdf-hist" && el.dataset.scope === "one") { ui.pdfMenu = !ui.pdfMenu; render(); return; }
  if (act === "pdf-hist") { ui.pdfMenu = false; buildHistoryPdf(el.dataset.scope).catch((err) => toast(err.message || "Не удалось сделать PDF")); return; }
  if (act === "pdf-person") { ui.pdfMenu = false; buildHistoryPdf("one", el.dataset.id).catch((err) => toast(err.message || "Не удалось сделать PDF")); return; }
  if (act === "pdf-close") { ui.pdfPreview = false; pdfDraft = null; render(); return; }
  if (act === "pdf-save") {
    const draft = pdfDraft;
    if (!draft) return;
    savePdf(draft.blob, draft.filename).then(() => { ui.pdfPreview = false; pdfDraft = null; render(); }).catch((err) => toast(err.message || "Не удалось сохранить"));
    return;
  }
  if (act === "pdf-check") { ui.checkMenu = ""; buildCheckPdf(el.dataset.id || "").catch((err) => toast(err.message || "Не удалось сделать PDF")); return; }
  if (act === "check-menu") { ui.pdfMenu = false; ui.checkMenu = ui.checkMenu === el.dataset.id ? "" : el.dataset.id; render(); return; }
  if (act === "pdf-check-person") { ui.checkMenu = ""; buildCheckPdf(el.dataset.id || "", el.dataset.person).catch((err) => toast(err.message || "Не удалось сделать PDF")); return; }
});
app.addEventListener("submit", (e) => {
  capture();
  if (e.target.id === "add-person") { e.preventDefault(); const name = new FormData(e.target).get("name").toString().trim(); if (!name) return; state.people.push({ id: uid(), name, color: nextColor(), archived: false }); touch(); render(); return; }
  if (e.target.id === "restock-form") { e.preventDefault(); saveRestock(); return; }
  if (e.target.id === "opening-form") {
    e.preventDefault(); const date = e.target.date.value; const packId = e.target.packId.value;
    if (!packId) { toast("Нет пачки"); return; }
    state.openings = state.openings.filter((o) => o.packId !== packId);
    state.openings.push({ id: uid(), date, packId });
    ui.sheet = null; touch(); toast("Пачка открыта"); render();
  }
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains("cup-input")) {
    if (t.dataset.skip === "1") { delete t.dataset.skip; return; }
    setCups(t.dataset.date, t.dataset.id, t.value);
    return;
  }
  if (t.dataset && t.dataset.person) { const p = personById(t.dataset.person); if (p) p.name = t.value.trim() || p.name; touch(); return; }
  if (t.dataset && t.dataset.act === "archive") { const p = personById(t.dataset.id); if (p) p.archived = t.checked; touch(); render(); return; }
  if (t.id === "period") { ui.periodId = t.value; render(); return; }
  if (t.id === "who") { ui.personId = t.value; render(); return; }
  if (t.id === "estimate") { ui.estimate = t.value; render(); return; }
  if (t.id === "hist-price") { ui.histPrice = t.value; render(); return; }
  if (t.dataset && t.dataset.dep && ui.restockDraft) { readRestock(document.getElementById("restock-form"), ui.restockDraft); render(); return; }
  if (t.id === "import-file" && t.files && t.files[0]) {
    t.files[0].text().then((text) => { applyDoc(JSON.parse(text)); touch(); toast("JSON загружен"); }).catch(() => toast("Не удалось прочитать файл"));
  }
  if (t.id === "masterKey" || t.id === "binId" || t.id === "binPassword" || t.id === "autoSync") capture();
  if (t.dataset && t.dataset.kind === "name" && ui.restockDraft) {
    const found = lastPackDefaults(t.value);
    if (found && t.value.trim() && found.name.trim().toLowerCase() === t.value.trim().toLowerCase()) {
      const i = Number(t.dataset.pack); const form = document.getElementById("restock-form");
      form["pprice" + i].value = rub(found.priceKopecks); form["pmass" + i].value = found.massGrams;
      ui.restockDraft.packs[i].priceKopecks = found.priceKopecks; ui.restockDraft.packs[i].massGrams = found.massGrams;
    }
  }
});
app.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d && d.dataset && d.dataset.fold) ui.sections[d.dataset.fold] = d.open;
}, true);
app.addEventListener("pointerdown", (e) => {
  const btn = e.target.closest && e.target.closest('[data-act="cup"]');
  if (!btn || !btn.parentElement) return;
  const field = btn.parentElement.querySelector(".cup-input");
  if (field) field.dataset.skip = "1";
});
app.addEventListener("focusin", (e) => {
  const t = e.target;
  if (!t.classList || !t.classList.contains("cup-input")) return;
  const main = app.querySelector("main");
  const top = main ? main.scrollTop : 0;
  const lock = () => { if (main) main.scrollTop = top; };
  requestAnimationFrame(lock);
  setTimeout(lock, 60);
});
app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("cup-input")) {
    e.preventDefault();
    e.target.blur();
  }
});
render();
bootSync();
</script>
</body>
</html>
